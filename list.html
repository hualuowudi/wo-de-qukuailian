<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾珠绣 · 商品溯源列表</title>
<style>
  :root {
    --bg: #f6f2e9; --card: #fff; --ink: #332817; --muted: #8c7a5d;
    --gold: #b08d3e; --gold-soft: #e8d9b8; --red: #9e2b25; --green: #2e7d32; --line: #e6dcc8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  .top { background: linear-gradient(160deg,#b08d3e,#d4b15f); color: #fff; padding: 26px 22px; text-align: center; }
  .top h1 { font-size: 22px; font-family: "STKaiti","KaiTi",serif; letter-spacing: 3px; }
  .top p { font-size: 12px; opacity: .92; margin-top: 6px; letter-spacing: 1px; }
  .container { max-width: 1080px; margin: 20px auto; padding: 0 20px 60px; }
  .count-bar { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .item { background: var(--card); border-radius: 14px; box-shadow: 0 6px 18px rgba(120,90,40,.08); overflow: hidden; text-decoration: none; color: inherit; display: block; transition: transform .15s ease, box-shadow .15s ease; }
  .item:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(120,90,40,.15); }
  .item .imgwrap { width: 100%; height: 150px; background: #faf6ec; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .item img { width: 100%; height: 100%; object-fit: cover; }
  .item .body { padding: 12px 14px 14px; }
  .item .nm { font-size: 15px; font-weight: 700; font-family: "STKaiti","KaiTi",serif; }
  .item .cd { font-family: Consolas, monospace; font-size: 12px; color: var(--gold); margin-top: 6px; word-break: break-all; }
  .item .pr { color: var(--red); font-size: 16px; font-weight: 700; margin-top: 6px; }
  .item .buyer { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .error-box { margin: 30px 16px; padding: 20px; background: #fdecea; color: var(--red); border-radius: 12px; font-size: 13px; line-height: 1.8; }
</style>
</head>
<body>
<div class="top">
  <h1>拾珠绣 · 商品溯源列表</h1>
  <p>一件一码 · 点击商品查看专属溯源海报</p>
</div>

<div class="container">
  <div class="count-bar" id="countBar"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function () {
  'use strict';
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showError(e) {
    document.body.innerHTML = '<div class="error-box">无法加载溯源数据：' + esc(e && e.message) +
      '<br><br>请通过双击 start.bat 启动的本地服务访问（浏览器地址以 http:// 开头）。</div>';
  }

  fetch('data/溯源数据.json').then(function (r) { return r.json(); }).then(function (data) {
    var products = data.products || [];
    $('countBar').textContent = '共 ' + products.length + ' 件商品 · 每件独立防伪码与链上存证';

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    products.forEach(function (p) {
      var buyer = p.stages && p.stages[2] ? p.stages[2].operator : '';
      var a = document.createElement('a');
      a.className = 'item';
      a.href = 'index.html?code=' + encodeURIComponent(p.code);
      a.innerHTML =
        '<div class="imgwrap"><img src="assets/product.png" alt="' + esc(p.name) + '"></div>' +
        '<div class="body">' +
          '<div class="nm">' + esc(p.name) + '</div>' +
          '<div class="cd">' + esc(p.code) + '</div>' +
          '<div class="pr">¥' + esc(p.price) + '</div>' +
          '<div class="buyer">购买人 · ' + esc(buyer) + '</div>' +
        '</div>';
      grid.appendChild(a);
    });
  }).catch(showError);

  function $(id) { return document.getElementById(id); }
})();
</script>
</body>
</html>
